
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPrepAI | Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">

        <div class="brand">
            <div class="brand-logo">E</div>
            <h2>ExamPrep<span>AI</span></h2>
            <p>PERSONALIZED DSA PREP</p>
        </div>

        <div class="auth-card">

            <div class="tabs">
                <button class="tab active" id="loginTab">Login</button>
                <button class="tab" id="signupTab">Sign Up</button>
            </div>

            <div id="message" class="message"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm">
                <h1>Welcome back!</h1>
                <p class="subtitle">Login to continue your preparation.</p>

                <label>Email Address</label>
                <input type="email" id="loginEmail"
                    placeholder="you@example.com" required>

                <label>Password</label>
                <input type="password" id="loginPassword"
                    placeholder="Enter your password" required>

                <button type="submit" class="submit-btn">
                    Login to Account
                </button>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="goSignup">Sign up</a>
                </p>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" hidden>
                <h1>Create Account</h1>
                <p class="subtitle">Start your personalized DSA journey.</p>

                <label>Full Name</label>
                <input type="text" id="signupName"
                    placeholder="Enter your name" required>

                <label>Email Address</label>
                <input type="email" id="signupEmail"
                    placeholder="you@example.com" required>

                <label>Password</label>
                <input type="password" id="signupPassword"
                    placeholder="Minimum 8 characters"
                    minlength="8" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                    placeholder="Confirm your password" required>

                <button type="submit" class="submit-btn">
                    Create Account
                </button>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="goLogin">Login</a>
                </p>
            </form>

        </div>

        <p class="footer">© 2026 ExamPrepAI. All rights reserved.</p>

    </main>

    <script src="script.js"></script>
</body>
</html>
